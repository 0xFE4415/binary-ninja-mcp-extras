[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binja-plugin"
version = "0.1.0"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
    "mutmut>=3.0,<4",
    "ty>=0.0.1",
    "ruff>=0.6",
    "nox>=2024.0",
]
all = [
    "binja-plugin[test,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=binja_plugin --cov-report=term-missing --cov-fail-under=100"

[tool.mutmut]
source_paths = ["src/binja_plugin/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-o", "addopts="]
also_copy = ["pyproject.toml"]
on_dependency_change = "rerun"

[tool.coverage.run]
source = ["binja_plugin"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "PLR0915", "C901"]
ignore = ["D"]

[tool.ruff.lint.per-file-ignores]
# The tools package registry re-exports every tool handler after defining the shared
# helpers those modules import from it, so its imports are intentionally bottom-loaded
# and unused-in-module.
"src/binja_plugin/tools/__init__.py" = ["E402", "F401"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.environment]
extra-paths = ["stubs"]

[tool.ty.src]
include = ["src", "tests"]

[tool.setuptools.packages.find]
where = ["src"]
