[package]
name = "binja_plugin_native"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Native Rust MCP tools for the binja-plugin Binary Ninja plugin"

[workspace]

[lib]
# rlib lets benches/ link the scan engine; the cdylib is what installs.
crate-type = ["cdylib", "rlib"]
# The lib's libtest harness would reject criterion's CLI flags under `cargo bench`.
bench = false

[[bench]]
name = "scan"
harness = false

# `core` links the real libbinaryninjacore (default — what installs as a
# plugin). Building without it compiles a stub core via cmake instead, which
# lets `cargo test`/`clippy` run without a Binary Ninja install (nox native,
# CI). `--no-default-features` only strips OUR defaults, so the wrapper
# dependency must carry default-features = false or its own `core` default
# would silently re-enable real-core linking.
[features]
default = ["core"]
core = ["binaryninja/core"]

# Both crates must be pinned to the same revision of binaryninja-api, ideally
# the commit this Binary Ninja build was made from (api_REVISION.txt). The sys
# crate is a direct dependency so the DEP_BINARYNINJACORE_PATH linker handshake
# propagates to our build script (links = "binaryninjacore" only reaches direct
# dependents).
[dependencies]
binaryninja = { git = "https://github.com/Vector35/binaryninja-api.git", rev = "403768cfc906aaf8cf4903dfdded4da4c02af5fd", default-features = false, features = ["schemars"] }
# default-features = false: the sys crate itself defaults to core; without
# this, --no-default-features on our crate could never reach stub mode.
binaryninjacore-sys = { git = "https://github.com/Vector35/binaryninja-api.git", rev = "403768cfc906aaf8cf4903dfdded4da4c02af5fd", default-features = false }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
memchr = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
# Keep unwinding so a panicking MCP tool becomes an internal_error result
# instead of ending the Binary Ninja process (see mcp-tools.html).
panic = "unwind"

# cargo-mutants builds (mutants.toml selects this profile) expect their tests
# to fail, so debug info buys nothing and only slows every mutant's build.
[profile.mutants]
inherits = "test"
debug = "none"
